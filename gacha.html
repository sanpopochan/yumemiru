<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171832"><title>夢ガチャ｜ユメミル</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#f9efff;background:#171632}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#5b3c9b,#1a1739 78%)}button{font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.app{max-width:580px;margin:0 auto;padding-bottom:110px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#201a42}.topbar a{color:#f6eaff;text-decoration:none;font-weight:700}.topbar span{font-size:12px;color:#d6c2f5}.art{position:relative;overflow:hidden;aspect-ratio:1086/850}.art img{width:100%;height:auto;display:block}.art button{position:absolute;left:21%;top:81%;width:59%;height:14%;border:0;border-radius:99px;background:transparent;color:transparent}.art button:focus-visible{outline:4px solid #fff;outline-offset:-5px}.result{margin:0 14px 16px;padding:20px 18px;border-radius:22px;border:2px solid #cba8ff;background:linear-gradient(140deg,#48317d,#30265e);box-shadow:0 0 28px #ab74ff45}.eyebrow{font-size:12px;color:#f9d7ff;letter-spacing:1px}.result h2{font-size:21px;line-height:1.5;margin:12px 0;overflow-wrap:anywhere}.result p{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:#f2e9ff}.category{display:inline-block;background:#7458a9;border-radius:99px;padding:5px 12px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px}.actions button,.actions a{border:1px solid #d9baff;background:#49317f;color:white;border-radius:15px;text-align:center;padding:13px 8px;font-weight:700;text-decoration:none;min-height:52px}.actions .primary{grid-column:1/-1;background:linear-gradient(90deg,#ac72ff,#d69bff);color:#21143c;border:0}.actions a[aria-disabled=true]{pointer-events:none;opacity:.45}.info{margin:18px 18px 0;font-size:12px;line-height:1.8;color:#d6c8ef;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1d36f5;border-top:1px solid #655282;padding:13px 12px max(13px,env(safe-area-inset-bottom));text-align:center}.nav a{color:#f4e7ff;text-decoration:none;font-weight:700}.busy .art img{animation:shimmer .7s ease-in-out 2}@keyframes shimmer{50%{filter:brightness(1.35) saturate(1.3)}}@media(prefers-reduced-motion:reduce){.busy .art img{animation:none}}
</style></head><body><main class="app" id="app"><header class="topbar"><a href="./">← ユメミルに戻る</a><span>✦ 夢ガチャ ✦</span></header><div class="art"><img src="gacha-art.png" alt="ねむりと猫ちゃんが見守る、星と月の夢ガチャマシン"><button type="button" id="spinArt" aria-label="夢ガチャを回す">夢ガチャを回す</button></div><section class="result" aria-live="polite"><div class="eyebrow">✦ 出た夢 ✦</div><h2 id="dreamTitle">どんな夢が出るかな？</h2><span class="category" id="dreamCategory">夢を抽選しよう</span><p id="dreamBody">ボタンを押すと、ユメミルに投稿された夢からランダムでひとつ届くよ。</p></section><div class="actions"><button type="button" class="primary" id="spin">🌙 夢ガチャを回す</button><a id="read" href="./" aria-disabled="true">📖 夢を読む</a><button type="button" id="again">🔄 もう一回</button></div><p class="info" id="hint">無料・ログイン不要で遊べるよ。<br>表示されるのはユメミルに公開された夢だよ。</p></main><nav class="nav"><a href="./">⌂ ユメミルのホームへ戻る</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{
const URL='https://fbchoovsrtmbzgwgzdfv.supabase.co';
const KEY='sb_publishable_UctQc4Aknq1bDYAQ_k4Pfg_KPxlXB_t';
const db=window.supabase?.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let lastId=null,working=false;
const fields='id,title,category,body';
async function spin(){
 if(working)return;
 if(!db){$('dreamTitle').textContent='接続できませんでした';$('dreamBody').textContent='通信環境を確認して、もう一度試してね。';return;}
 working=true;document.body.classList.add('busy');$('spin').disabled=$('again').disabled=$('spinArt').disabled=true;
 $('dreamTitle').textContent='夢を探しているよ…';$('dreamCategory').textContent='✦ 抽選中 ✦';$('dreamBody').textContent='ねむりが夢を集めています…';$('read').setAttribute('aria-disabled','true');
 try{
  const {count,error:countError}=await db.from('dreams').select('id',{count:'exact',head:true});
  if(countError)throw countError;
  if(!count){$('dreamTitle').textContent='まだ夢がないみたい';$('dreamBody').textContent='最初の夢が投稿されるのを待ってね。';return;}
  let dream=null;
  for(let attempt=0;attempt<5;attempt++){
   const offset=Math.floor(Math.random()*count);
   const r=await db.from('dreams').select(fields).order('id',{ascending:true}).range(offset,offset);
   if(r.error)throw r.error;
   dream=r.data?.[0];
   if(dream&&(count===1||dream.id!==lastId))break;
  }
  if(!dream)throw new Error('夢を取得できませんでした');
  lastId=dream.id;
  $('dreamTitle').textContent=dream.title||'名前のない夢';
  $('dreamCategory').textContent=dream.category||'夢';
  const body=String(dream.body||'');
  $('dreamBody').textContent=body.length>170?body.slice(0,170)+'…':body;
  const link=new URL('./',location.href);link.searchParams.set('dream',String(dream.id));
  $('read').href=link.href;$('read').removeAttribute('aria-disabled');
  $('hint').textContent='気になる夢が出たら「夢を読む」で全文を見てね。';
 }catch(err){console.error(err);$('dreamTitle').textContent='夢を取り出せなかったよ';$('dreamCategory').textContent='通信エラー';$('dreamBody').textContent='少し待ってから、もう一回試してね。';}
 finally{working=false;document.body.classList.remove('busy');$('spin').disabled=$('again').disabled=$('spinArt').disabled=false;}
}
$('spin').onclick=$('again').onclick=$('spinArt').onclick=spin;
})();
</script></body></html>
