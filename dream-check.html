(()=>{'use strict';const comments=[{"id": "a01", "text": "この夢は食べ物なので冷蔵庫に保管しました。冷蔵庫ごと消えました。", "keys": ["食べ物", "食事", "ご飯", "料理", "食べた", "食べる"]}, {"id": "a02", "text": "夢の猫を捕まえたはずなのに、なぜかわたしが首輪をつけられています……。", "keys": ["猫", "ネコ", "ねこ"]}, {"id": "a03", "text": "猫さんに調査を頼んだら、わたしの仕事だけ増えました……。", "keys": ["猫", "ネコ", "ねこ"]}, {"id": "a04", "text": "夢のテストを回収しました。なぜかわたしの名前で0点がついています……。", "keys": ["テスト", "試験", "受験"]}, {"id": "a05", "text": "学校の夢を調査しに行ったら、先生に宿題を出されました。", "keys": ["学校", "先生", "宿題"]}, {"id": "a06", "text": "夢の教室に入ったら、わたしだけまだ卒業できていませんでした……。", "keys": ["教室", "卒業", "学校"]}, {"id": "a07", "text": "おばけを捕まえました。……今、わたしが瓶の中にいます。", "keys": ["おばけ", "オバケ", "幽霊"]}, {"id": "a08", "text": "怖い夢を調査していたら、おばけのほうから『怖い』と言われました……。", "keys": ["怖い", "恐い", "おばけ", "幽霊", "悪夢"]}, {"id": "a09", "text": "夢の中の残業を回収しました。現実の残業に加算されました……。", "keys": ["残業", "仕事", "会社"]}, {"id": "a10", "text": "夢の中で退職しました。起きたら夢管理局の新人研修からやり直しでした……。", "keys": ["退職", "辞める", "仕事", "会社"]}, {"id": "s01", "text": "夢のケーキを保管していたら、賞味期限が昨日になっていました。まだ明日作る予定なのに……。", "keys": ["ケーキ"]}, {"id": "s02", "text": "夢のラーメンを回収したら、麺が長すぎてまだ回収が終わりません……。", "keys": ["ラーメン", "麺"]}, {"id": "s05", "text": "夢の犬を散歩させていたら、いつの間にかわたしが散歩されていました……。", "keys": ["犬", "いぬ", "イヌ", "散歩"]}, {"id": "s06", "text": "夢の猫を保護しました。翌日、わたしの机に『猫専用』の札がついていました……。", "keys": ["猫", "ネコ", "ねこ"]}, {"id": "s08", "text": "夢の鳥を逃がさないように見張っていたら、わたしだけ鳥かごに閉じ込められました……。", "keys": ["鳥", "鳥かご"]}, {"id": "s12", "text": "夢の先生に『帰っていいよ』と言われました。帰ったら夢管理局から欠勤扱いされました……。", "keys": ["先生", "学校"]}, {"id": "s15", "text": "幽霊の夢を調査したら、幽霊から『ここ、わたしの職場です』と言われました……。", "keys": ["幽霊"]}, {"id": "s16", "text": "怖い夢を回収したら、おばけが『一緒に帰ろう』とついてきました。……上司でした。", "keys": ["おばけ", "オバケ", "怖い", "悪夢"]}, {"id": "s18", "text": "夢の仕事を片付けたら、『仕事を片付ける仕事』が新しく発生しました……。", "keys": ["仕事", "会社", "職場"]}, {"id": "s20", "text": "夢の中で定時退勤できました。起きたら出勤時間でした……。", "keys": ["退勤", "定時", "出勤", "仕事"]}, {"id": "21", "text": "夢の寿司を回収したら、回転レーンに乗せられて、わたしが一周して戻ってきました……。", "keys": ["寿司", "すし", "スシ"]}, {"id": "26", "text": "夢のペンギンを保護したら、わたしの仕事場が南極支部になっていました……。", "keys": ["ペンギン"]}, {"id": "27", "text": "夢のカタツムリを追いかけています。昨日からずっと追いつけません……。", "keys": ["カタツムリ", "かたつむり"]}, {"id": "29", "text": "夢の金魚を水槽に戻したら、なぜかわたしが水槽の外に出られなくなりました……。", "keys": ["金魚", "水槽"]}, {"id": "33", "text": "夢の授業を調査していたら、チャイムが鳴るたびに一時間目に戻ります……。", "keys": ["授業", "チャイム", "学校"]}, {"id": "38", "text": "夢の鏡を調査したら、鏡の中のわたしだけ定時で帰っていました……。", "keys": ["鏡", "かがみ", "ミラー"]}, {"id": "42", "text": "夢のエレベーターで出勤したら、地下99階に着きました。会社は2階です……。", "keys": ["エレベーター", "地下"]}, {"id": "49", "text": "夢の中の夢を回収しています。もう何回起きたのかわかりません……。", "keys": ["夢の中の夢", "夢から覚め", "何度も起き", "目が覚めた"]}, {"id": "51", "text": "空を飛ぶ夢を調査していたら、わたしだけ飛行許可が下りませんでした。鳥さんには下りたのに……。", "keys": ["飛ぶ", "飛んだ", "飛んで", "飛べる", "飛行", "空を飛"]}, {"id": "52", "text": "雲の上で夢を回収していたら、雲が雨になりました。まだ書類を置いてあるんですけど……。", "keys": ["雲", "雲の上"]}, {"id": "60", "text": "追いかけられる夢を回収しようとしたら、夢のほうが逃げ出しました。現在、捜索願いを出しています……。", "keys": ["追いかけ", "追われ", "逃げ", "逃走"]}, {"id": "62", "text": "夢のデートを調査していたら、なぜかわたしが二人分の食事代を払うことになりました……。", "keys": ["デート"]}, {"id": "63", "text": "結婚式の夢を回収しました。わたしは招待されたはずなのに、受付で働いていました……。", "keys": ["結婚式", "ウェディング"]}, {"id": "67", "text": "夢の飛行機に乗ったら、機内アナウンスで「本日の目的地は未定です」と言われました。もう離陸してるのに……。", "keys": ["飛行機", "機内", "離陸"]}, {"id": "71", "text": "歯が抜ける夢を回収しました。数を確認したら、抜けた歯のほうが元の歯より多かったんです……。", "keys": ["歯が抜", "歯が落", "歯が取"]}, {"id": "73", "text": "声が出ない夢を調査したら、わたしの声だけ別室で会議に参加していました……。", "keys": ["声が出", "声がで", "声がなく", "声を失"]}, {"id": "77", "text": "夢の中で昨日に戻ったら、昨日のわたしに「明日の仕事、お願いね」と言われました……。", "keys": ["昨日に戻", "過去に戻", "タイムスリップ", "昨日に"]}, {"id": "80", "text": "夢の中で目が覚めたら、また夢でした。確認のために起きたら、また夢でした。……出勤できません。", "keys": ["夢の中で目が覚め", "夢から覚め", "また夢", "二度寝", "起きたら夢"]}, {"id": "85", "text": "夢の誕生日会を調査したら、ケーキのろうそくを消すたびに一歳若返ります。もう赤ちゃんです……。", "keys": ["誕生日", "バースデー", "ろうそく"]}, {"id": "86", "text": "夢のスーパーで買い物をしたら、お釣りが来週届くと言われました。レシートだけ3メートルあります……。", "keys": ["スーパー", "買い物", "お釣り", "レシート"]}, {"id": "87", "text": "夢の福袋を回収しました。中には福袋が入っていて、その中にも福袋が……。まだ開封作業中です。", "keys": ["福袋"]}, {"id": "90", "text": "夢のセール会場を調査したら、わたしの休憩時間だけ90％オフになっていました……。", "keys": ["セール", "バーゲン", "割引"]}, {"id": "91", "text": "夢のスマホに通知が来ました。「ねむりさん、まだ夢の中ですよ」。……誰が送ったんでしょう。", "keys": ["スマホ", "携帯", "通知"]}, {"id": "93", "text": "夢のスマホを充電したら、バッテリーが200％になりました。代わりにわたしの元気が0％です……。", "keys": ["充電", "バッテリー"]}, {"id": "94", "text": "夢の検索エンジンで「夢から出る方法」を調べたら、検索結果が全部「あと5分寝る」でした……。", "keys": ["検索", "ググる", "調べた", "検索エンジン"]}, {"id": "96", "text": "夢の試験会場に着いたら、試験科目が「夢から覚める方法」でした。わたしだけまだ受験中です……。", "keys": ["試験", "受験", "テスト"]}, {"id": "101", "text": "夢の雨を回収していたら、傘の内側だけ雨が降り始めました……。", "keys": ["雨", "傘"]}, {"id": "102", "text": "夢の雪だるまを保管したら、翌朝わたしの席で仕事をしていました。わたしより優秀です……。", "keys": ["雪だるま"]}, {"id": "103", "text": "夢の台風を瓶に閉じ込めました。今、瓶の中から天気予報が聞こえています……。", "keys": ["台風", "暴風", "嵐"]}, {"id": "104", "text": "夢の虹を回収したら、七色のうち一色だけ有給休暇を取っていました……。", "keys": ["虹"]}, {"id": "105", "text": "夢の地震を調査したら、揺れているのはわたしの机だけでした。しかも机は休憩中です……。", "keys": ["地震", "揺れ"]}, {"id": "112", "text": "夢のお風呂を調査したら、お湯が全部昨日のものだと言われました。今日はまだ沸かしてないそうです……。", "keys": ["風呂", "お風呂", "湯船", "入浴"]}, {"id": "113", "text": "夢の洗濯物を干したら、乾くまでに三年かかると言われました。明日の制服なんですけど……。", "keys": ["洗濯", "洗濯物"]}, {"id": "114", "text": "夢の掃除機を使ったら、部屋のほうが吸い込まれました。掃除機だけ残っています……。", "keys": ["掃除機", "掃除"]}, {"id": "115", "text": "夢の玄関を開けたら、また同じ玄関でした。もう18回ただいまって言っています……。", "keys": ["玄関"]}, {"id": "117", "text": "夢の魚を調査したら、魚たちが全員泳ぎ方の講習を受けていました。講師はカナヅチのわたしです……。", "keys": ["魚", "さかな"]}, {"id": "126", "text": "夢のカメを追いかけたら、先にゴールしていました。わたしはまだスタートの説明を聞いています……。", "keys": ["カメ", "亀", "かめ"]}, {"id": "137", "text": "夢の階段を上っていたら、途中から下り階段になりました。まだ上っているつもりなんですけど……。", "keys": ["階段"]}, {"id": "139", "text": "夢の自動ドアを調査しました。わたしが近づくと閉まり、離れると開きます。もう30分ここにいます……。", "keys": ["自動ドア"]}, {"id": "140", "text": "夢の中で目覚まし時計が鳴りました。止めたら、時計のほうが二度寝しました。わたしは出勤です……。", "keys": ["目覚まし", "アラーム", "目覚まし時計"]}],fallback=[{"id": "145", "text": "この夢には入口があるのに出口がありません。……あ、わたしもまだ中にいます。"}, {"id": "146", "text": "夢の記録を確認したら、まだ見ていないはずの続きが書かれていました。しかもわたしが謝っています……。"}, {"id": "153", "text": "この夢を調べていたら、途中から夢がわたしのことを調べ始めました。質問が多くて帰れません……。"}, {"id": "157", "text": "この夢を持ち帰ろうとしたら、夢から「持ち出し禁止です」と注意されました。わたしが取り残されています……。"}, {"id": "160", "text": "調査結果をまとめようとしたら、この夢から「まだ終わってません」と連絡が来ました。続きはいつなんでしょう……。"}];const input=document.getElementById('dream'),button=document.getElementById('check'),result=document.getElementById('result'),answer=document.getElementById('answer'),subject=document.getElementById('subject'),status=document.getElementById('status');let lastId='',counter=0;input.addEventListener('input',()=>{document.getElementById('counter').textContent=Array.from(input.value).length;button.disabled=!input.value.trim();result.classList.remove('show')});function choose(arr){const eligible=arr.filter(x=>x.id!==lastId);return (eligible.length?eligible:arr)[Math.floor(Math.random()*(eligible.length?eligible:arr).length)]}function find(text){const norm=text.normalize('NFKC').toLowerCase();const matches=comments.map(c=>{let score=0;for(const key of c.keys){if(norm.includes(key.normalize('NFKC').toLowerCase()))score+=Math.max(2,key.length)}return {...c,score}}).filter(c=>c.score>0);if(!matches.length)return choose(fallback);const max=Math.max(...matches.map(x=>x.score));return choose(matches.filter(x=>x.score===max))}function render(){const text=input.value.trim();if(!text)return;const c=find(text);lastId=c.id;counter++;subject.textContent='調査対象：'+(text.length>85?text.slice(0,85)+'…':text);answer.textContent='「'+c.text+'」';document.getElementById('serial').textContent='第'+String(counter).padStart(4,'0')+'号';status.textContent='調査完了 ☾';result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'})}button.addEventListener('click',render);document.getElementById('retry').addEventListener('click',render);document.getElementById('copy').addEventListener('click',async()=>{const txt='🌙 ねむりの夢鑑定室\n'+subject.textContent+'\n'+answer.textContent+'\nhttps://sanpopochan.github.io/yumemiru/dream-check.html';try{await navigator.clipboard.writeText(txt);document.getElementById('copy').textContent='✓ コピーしました';setTimeout(()=>document.getElementById('copy').textContent='▤ 結果をコピー',1600)}catch{window.prompt('コピーしてください',txt)}});
})();
